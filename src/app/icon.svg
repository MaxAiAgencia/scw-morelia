  <path d="M12.5 22 Q16 24.5 19.5 22" stroke="#B8860B" stroke-width="0.8" fill="none"/>

  <!-- Left cheek stripe -->
  <path d="M8 17 Q9 20 10 23" stroke="#CC0000" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Right cheek stripe -->
  <path d="M24 17 Q23 20 22 23" stroke="#CC0000" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Chin strap left -->
  <path d="M9 23 Q11 27 16 28" stroke="#B8860B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Chin strap right -->
  <path d="M23 23 Q21 27 16 28" stroke="#B8860B" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Outer ring accent -->
