<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#0a0a0a"/>

  <!-- Mask main shape -->
  <ellipse cx="16" cy="17" rx="10" ry="11" fill="#D4A017"/>

  <!-- Forehead panel -->
  <path d="M8.5 13 Q16 7 23.5 13 L22 15 Q16 10.5 10 15 Z" fill="#B8860B"/>

  <!-- Center stripe -->
  <rect x="14.5" y="8" width="3" height="8" rx="1" fill="#CC0000"/>

  <!-- Left eye hole -->
  <ellipse cx="11.5" cy="16" rx="2.8" ry="2" fill="#0a0a0a"/>
  <!-- Left eye inner -->
  <ellipse cx="11.5" cy="16" rx="1.8" ry="1.3" fill="#111"/>

  <!-- Right eye hole -->
  <ellipse cx="20.5" cy="16" rx="2.8" ry="2" fill="#0a0a0a"/>
  <!-- Right eye inner -->
  <ellipse cx="20.5" cy="16" rx="1.8" ry="1.3" fill="#111"/>

  <!-- Nose bridge -->
  <path d="M14.5 18 Q16 19.5 17.5 18" stroke="#B8860B" stroke-width="1" fill="none"/>

  <!-- Mouth cutout -->
